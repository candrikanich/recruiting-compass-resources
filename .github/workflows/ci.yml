name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Newly disclosed advisories land without any code change.
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Test & Build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Audit production dependencies
        run: npm run audit:gate

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
