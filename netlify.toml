[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"

# baseURL is /resources, so generated files land under .output/public/resources.
# On a standalone Netlify host the root would 404 — send it to the content root.
[[redirects]]
  from = "/"
  to = "/resources"
  status = 302
  force = true
